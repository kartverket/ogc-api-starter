services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:5000
      - API_BASE_URL_PUBLIC=http://localhost:5001
    platform: linux/amd64
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pygeoapi-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5001:5000"
    environment:
      - PYGEOAPI_URL=http://localhost:5001
    platform: linux/amd64
    volumes:
      - ./data:/data
    networks:
      - pygeoapi-network

networks:
  pygeoapi-network:
    driver: bridge
